services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - stratum-data:/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
     - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  stratum-data:
